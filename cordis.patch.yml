# cordis.patch.yml — loaded with: dsh --profile <profile> --patch <this file>
# Disable the base ratio-only engine and mount the handoff engine instead.
# Paths are machine-local (this workspace); universal across both DSH
# checkouts — the plugin's imports resolve through deepseek_plugins/node_modules
# junctions, which scripts/link-node-modules.mjs re-points at whichever
# checkout boots the harness.
# Windows absolute paths MUST be file:// URLs: the loader's tree.import()
# does a raw import(name) for absolute specifiers, and import('D:/...')
# fails with ERR_UNSUPPORTED_ESM_URL_SCHEME (protocol 'd:').
- id: compaction-basic
  disabled: true
- insert:
    - id: compaction-handoff
      name: 'file:///D:/my_deepseek_harness/deepseek_plugins/compaction-handoff/src/index.ts'
      config:
        configFile: 'D:/my_deepseek_harness/deepseek_plugins/handoff-config.json'
    - id: compact-config-command
      name: 'file:///D:/my_deepseek_harness/deepseek_plugins/compact-config-command/src/index.ts'
    - id: web-compact-config
      name: web-compact-config
      config:
        configFile: 'D:/my_deepseek_harness/deepseek_plugins/handoff-config.json'
    # File editor client plugin (FE-M-A): the row names the PACKAGE (the
    # registry resolves it through the delivery junction and reads its own
    # dsh.client declaration — a file-URL row keeps the host half mounted but
    # breaks the client verdict, see MEMORY.md).
    - id: web-file-editor
      name: web-file-editor
